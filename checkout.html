<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineBook | Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span>◆</span>CineBook</a><nav><a href="index.html">Movies</a><a class="active" href="#">Checkout</a></nav><button class="theme-toggle" aria-label="Toggle theme">☼</button></header><main class="checkout"><a class="back" href="seats.html">← Back to seats</a><div class="checkout-layout"><form id="checkout-form" class="form-card"><p class="eyebrow">FINAL STEP</p><h1>Almost there</h1><p class="muted">Your tickets will be sent to the details below.</p><label>Full name<input name="name" required placeholder="Your full name"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Phone number<input name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number"></label><p class="payment-label">Payment method</p><div class="payment-options"><label><input type="radio" name="payment" value="UPI" checked> UPI</label><label><input type="radio" name="payment" value="Card"> Card</label><label><input type="radio" name="payment" value="Cash at counter"> Cash</label></div><button class="button wide" type="submit">Confirm booking →</button></form><aside id="checkout-summary" class="summary-card"></aside></div></main><script src="js/data.js"></script><script src="js/checkout.js"></script></body></html>
